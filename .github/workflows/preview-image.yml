name: Preview Image

# TEMPORARY, for testing the members work on a live site before it is
# released. Remove this file and `.github/preview-image.version` before the
# branch is merged.
#
# Builds the server image from this branch and pushes it to GHCR under the
# pre-release version named in `.github/preview-image.version`, and nothing
# else: no `latest`, no minor tag, no GitHub release. It runs only when that
# file changes, so an ordinary push does not rebuild the image.

on:
  push:
    branches:
      - feat/members-demo
    paths:
      - .github/preview-image.version

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish Preview Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve preview version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < .github/preview-image.version)"
          # A pre-release only (1.2.3-name.1), so a preview can never take a release tag.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$ ]]; then
            echo "::error::\"$VERSION\" is not a pre-release version such as 0.0.23-members.1"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The server reports the version in package.json, so the image must
      # carry the preview version there too. The change is not committed.
      - name: Stamp the version into package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/corebunch/instatic:${{ steps.version.outputs.version }}
          build-args: |
            INSTATIC_VERSION=${{ steps.version.outputs.version }}
            INSTATIC_REVISION=${{ github.sha }}
            INSTATIC_CREATED=${{ steps.version.outputs.created }}
