name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/corebunch/instatic
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTATIC_VERSION=${{ steps.version.outputs.version }}
            INSTATIC_REVISION=${{ github.sha }}
            INSTATIC_CREATED=${{ steps.version.outputs.created }}

  server-artifacts:
    name: Publish Server Artifacts
    # macOS arm64 runner cross-compiles every supported target from one machine.
    # Pinned to a release GitHub still hosts: `macos-14` was retired, and a
    # retired label cancels this job after the image is already published.
    runs-on: macos-15
    timeout-minutes: 30
    needs:
      - verify
      - image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (all platforms' native packages)
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Build admin app
        run: bun run build

      - name: Build server artifacts
        run: bun run release:server-artifacts -- --all --version "${{ needs.image.outputs.version }}"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Instatic ${{ needs.image.outputs.version }}" \
            --generate-notes

      - name: Upload server artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .tmp/server-artifacts/instatic-server-*.tar.gz \
            .tmp/server-artifacts/instatic-server-*-checksums.txt \
            --clobber

  bundle:
    name: Publish Release Bundle
    runs-on: ubuntu-latest
    needs:
      - verify
      - image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release bundle
        run: bun run release:bundle -- "${{ needs.image.outputs.version }}"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Instatic ${{ needs.image.outputs.version }}" \
            --generate-notes

      - name: Upload release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ".tmp/release/instatic-${{ needs.image.outputs.version }}-release-bundle.tar.gz" \
            --clobber

  plugin-sdk:
    name: Publish Plugin SDK
    runs-on: ubuntu-latest
    needs:
      - verify
      - image
    env:
      SDK_TARBALL: .tmp/plugin-sdk/instatic-plugin-sdk-${{ needs.image.outputs.version }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin SDK package
        run: bun run sdk:pack -- "${{ needs.image.outputs.version }}"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Instatic ${{ needs.image.outputs.version }}" \
            --generate-notes

      - name: Upload plugin SDK package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$SDK_TARBALL" --clobber

  plugin-sdk-npm:
    name: Publish Plugin SDK to npm
    # npm trusted publishing: the registry accepts this workflow's OIDC token,
    # so there is no token secret. It only works once @instatic/plugin-sdk
    # exists on npm with this workflow set as its trusted publisher; until
    # then this job reports that and publishes nothing.
    runs-on: ubuntu-latest
    needs:
      - image
      - plugin-sdk
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ needs.image.outputs.version }}
    steps:
      - name: Check whether the package can be published
        id: npm
        shell: bash
        run: |
          if ! npm view @instatic/plugin-sdk name >/dev/null 2>&1; then
            echo "::notice::@instatic/plugin-sdk is not on npm yet. Skipping the npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "@instatic/plugin-sdk@${SDK_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@instatic/plugin-sdk ${SDK_VERSION} is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the released package
        if: steps.npm.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "instatic-plugin-sdk-${SDK_VERSION}.tgz"

      # Trusted publishing needs npm 11.5.1 or newer; the runner ships an older one.
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: |
          npm install --global npm@^11.5.1
          npm publish "instatic-plugin-sdk-${SDK_VERSION}.tgz" --access public
