name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tagged changelog section
        run: bun scripts/release-notes.ts "$GITHUB_REF_NAME" > /dev/null

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/corebunch/instatic
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTATIC_VERSION=${{ steps.version.outputs.version }}
            INSTATIC_REVISION=${{ github.sha }}
            INSTATIC_CREATED=${{ steps.version.outputs.created }}

  release:
    name: Create GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Create release from tagged changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/generated-notes.md"
          bun scripts/release-notes.ts "$GITHUB_REF_NAME" "$RUNNER_TEMP/generated-notes.md" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Instatic ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"

  server-artifacts:
    name: Publish Server Artifacts
    # macOS arm64 runner cross-compiles every supported target from one machine.
    # Pinned to a release GitHub still hosts: `macos-14` was retired, and a
    # retired label cancels this job after the image is already published.
    runs-on: macos-15
    timeout-minutes: 30
    needs:
      - image
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (all platforms' native packages)
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Build admin app
        run: bun run build

      - name: Build server artifacts
        run: bun run release:server-artifacts -- --all --version "${{ needs.image.outputs.version }}"

      - name: Upload server artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .tmp/server-artifacts/instatic-server-*.tar.gz \
            .tmp/server-artifacts/instatic-server-*-checksums.txt \
            --clobber

  bundle:
    name: Publish Release Bundle
    runs-on: ubuntu-latest
    needs:
      - image
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release bundle
        run: bun run release:bundle -- "${{ needs.image.outputs.version }}"

      - name: Upload release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ".tmp/release/instatic-${{ needs.image.outputs.version }}-release-bundle.tar.gz" \
            --clobber

  plugin-sdk:
    name: Publish Plugin SDK
    runs-on: ubuntu-latest
    # After `bundle`, which creates the GitHub Release: this job only uploads.
    needs:
      - image
      - bundle
    env:
      SDK_VERSION: ${{ needs.image.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugin SDK package
        run: bun run sdk:pack -- "$SDK_VERSION"

      # Plugin projects lock this URL with an integrity hash, so an asset that
      # is already there is never replaced, even by a re-run of this job.
      - name: Upload plugin SDK package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="instatic-plugin-sdk-${SDK_VERSION}.tgz"
          EXISTING="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if grep -Fxq "$ASSET" <<<"$EXISTING"; then
            echo "::notice::${ASSET} is already attached to ${GITHUB_REF_NAME}. Leaving it as it is."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" ".tmp/plugin-sdk/${ASSET}"

  plugin-sdk-npm:
    name: Publish Plugin SDK to npm
    # Off until the repository variable PUBLISH_PLUGIN_SDK_TO_NPM is "true".
    # Set it once @instatic/plugin-sdk exists on npm with this workflow as its
    # trusted publisher: npm then accepts this job's OIDC token, so the
    # repository holds no npm token. See docs/deployment/release-workflow.md.
    if: ${{ vars.PUBLISH_PLUGIN_SDK_TO_NPM == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - image
      - plugin-sdk
    permissions:
      contents: read
      id-token: write
    env:
      SDK_VERSION: ${{ needs.image.outputs.version }}
    steps:
      # Trusted publishing needs npm 11.5.1 or newer; the runner ships an older one.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Check whether this version is already on npm
        id: npm
        shell: bash
        run: |
          set -uo pipefail
          # Only stdout decides "published": a warning on stderr must not.
          # A version on stdout: already there. An E404: not there, publish.
          # Anything else is a registry or network error and fails the job.
          if published="$(npm view "@instatic/plugin-sdk@${SDK_VERSION}" version 2>npm-view.err)"; then
            if [ "$published" = "$SDK_VERSION" ]; then
              echo "::notice::@instatic/plugin-sdk ${SDK_VERSION} is already on npm."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            elif [ -z "$published" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Unexpected answer from npm view: $published"
              cat npm-view.err
              exit 1
            fi
          elif grep -q 'E404' npm-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err
            exit 1
          fi

      - name: Download the released package
        if: steps.npm.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "instatic-plugin-sdk-${SDK_VERSION}.tgz"

      # A prerelease must not become what `bun add @instatic/plugin-sdk` installs.
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        shell: bash
        run: |
          case "$SDK_VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish "instatic-plugin-sdk-${SDK_VERSION}.tgz" --access public --tag "$DIST_TAG"
